name: "Deploy Kit: Self-Test"

# Runs test.sh on every push/PR to main — the kit verifies itself.
# Keeps the public repo trustworthy: if a change breaks a script, CI fails.

on:
  push:
    branches: [main]
    paths:
      - '*.sh'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '*.sh'
  workflow_dispatch:

jobs:
  selftest:
    name: Run test.sh (36 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure rsync (only install if missing)
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          fi

      - name: Run self-test
        run: |
          bash test.sh
